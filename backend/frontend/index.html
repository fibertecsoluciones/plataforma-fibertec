<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FiberTec · Iniciar sesión</title>
<link rel="icon" href="/img/logo.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="login-envoltura">
  <div class="login-tarjeta">
    <img src="/img/logo.png" alt="FiberTec" class="marca" />
    <h1>Panel de operación</h1>
    <p class="login-sub">Conectando contigo — inicia sesión para continuar</p>

    <div id="error-login" class="error-msg oculto"></div>

    <form id="form-login">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" required />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primario" id="btn-login">Entrar</button>
    </form>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
  // Si ya hay sesión activa, saltar directo al dashboard
  if (API.token() && API.usuario()) {
    window.location.href = '/dashboard.html';
  }

  const form = document.getElementById('form-login');
  const errorBox = document.getElementById('error-login');
  const btn = document.getElementById('btn-login');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('oculto');
    btn.disabled = true;
    btn.textContent = 'Entrando…';

    try {
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      const data = await API.post('/api/auth/login', { usuario, password });
      API.guardarSesion(data.token, data.usuario);
      window.location.href = '/dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('oculto');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
